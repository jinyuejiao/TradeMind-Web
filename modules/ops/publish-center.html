<div class="space-y-4 fade-in">
    <div class="flex flex-wrap gap-2" id="ops-publish-hub-tabs" role="tablist">
        <button type="button" data-publish-tab="plans" class="ops-publish-hub-tab px-4 py-2 rounded-2xl text-xs font-bold border-2 border-ops-600 bg-ops-600 text-white shadow-md">订阅定价</button>
        <button type="button" data-publish-tab="announce" class="ops-publish-hub-tab px-4 py-2 rounded-2xl text-xs font-bold border border-slate-200 bg-white/90 text-slate-600 hover:border-ops-300">系统公告</button>
        <button type="button" data-publish-tab="audit" class="ops-publish-hub-tab px-4 py-2 rounded-2xl text-xs font-bold border border-slate-200 bg-white/90 text-slate-600 hover:border-ops-300">审计日志</button>
    </div>

    <div id="ops-publish-tab-plans" class="ops-publish-tab-panel space-y-6">
        <div class="tm-ops-glass rounded-tm-3xl p-5 md:p-6">
            <h2 class="text-sm font-bold text-slate-800 flex items-center gap-2 mb-1"><i class="ph ph-tag text-ops-600"></i> 订阅策略（按商户类型）</h2>
            <p class="text-[10px] text-slate-500 leading-relaxed">数据来自 <code class="bg-slate-100 px-1 rounded">subscription_plans</code>；展示 D001 四档：试用 / 启航 / 优享 / 企业。</p>
            <p class="text-[10px] text-slate-400 mt-2 font-mono">GET/PUT /api/v1/ops/catalog/subscription-plans?merchantType=…</p>
        </div>
        <div class="flex flex-wrap gap-2" id="ops-plan-merchant-tabs" role="tablist">
            <button type="button" data-merchant="WHOLESALE" class="ops-plan-tab px-4 py-2 rounded-2xl text-xs font-bold border-2 border-ops-600 bg-ops-600 text-white shadow-md">批发</button>
            <button type="button" data-merchant="FOREIGN" class="ops-plan-tab px-4 py-2 rounded-2xl text-xs font-bold border border-slate-200 bg-white/90 text-slate-600 hover:border-ops-300">外贸</button>
            <button type="button" data-merchant="ECOM" class="ops-plan-tab px-4 py-2 rounded-2xl text-xs font-bold border border-slate-200 bg-white/90 text-slate-600 hover:border-ops-300">电商</button>
            <button type="button" data-merchant="FACTORY" class="ops-plan-tab px-4 py-2 rounded-2xl text-xs font-bold border border-slate-200 bg-white/90 text-slate-600 hover:border-ops-300">工贸一体</button>
        </div>
        <div class="flex flex-wrap items-center gap-2">
            <span id="ops-plan-save-hint" class="text-[10px] text-slate-400">编辑后请在弹窗内保存，将写入数据库</span>
        </div>
        <div class="tm-ops-glass rounded-tm-3xl overflow-hidden">
            <div class="px-5 py-4 border-b border-indigo-100/80 bg-white/50 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2">
                <h3 class="text-xs font-bold text-slate-800"><span id="ops-plan-merchant-label">批发</span> · 套餐列表（年付）</h3>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs min-w-[800px]">
                    <thead class="bg-ops-50/80 text-[10px] uppercase font-bold text-ops-800 tracking-wider">
                        <tr>
                            <th class="px-4 py-3">档位</th>
                            <th class="px-4 py-3">订阅名称</th>
                            <th class="px-4 py-3">年付原价</th>
                            <th class="px-4 py-3">年付现价</th>
                            <th class="px-4 py-3">折扣（自动）</th>
                            <th class="px-4 py-3 text-right">用户</th>
                            <th class="px-4 py-3 text-right">产品</th>
                            <th class="px-4 py-3 text-right">供应商</th>
                            <th class="px-4 py-3 text-right">客户</th>
                            <th class="px-4 py-3 text-right">操作</th>
                        </tr>
                    </thead>
                    <tbody id="ops-plan-table-body" class="divide-y divide-indigo-50 bg-white/60"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="ops-publish-tab-announce" class="ops-publish-tab-panel hidden">
        <div class="tm-ops-glass rounded-tm-3xl p-5 md:p-6">
            <h2 class="text-sm font-bold text-slate-800 flex items-center gap-2 mb-4"><i class="ph ph-megaphone text-ops-600"></i> 全站公告</h2>
            <p class="text-[10px] text-slate-500 mb-3">对接 <code class="bg-slate-100 px-1 rounded">POST /api/v1/ops/announcements</code>；支持 HTML。</p>
            <div class="space-y-3">
                <div>
                    <label class="text-[10px] font-bold text-slate-500 uppercase">生效时间</label>
                    <input type="datetime-local" id="ops-ann-from" class="mt-1 w-full rounded-2xl border border-slate-200 px-3 py-2 text-sm">
                </div>
                <div>
                    <label class="text-[10px] font-bold text-slate-500 uppercase">失效时间</label>
                    <input type="datetime-local" id="ops-ann-to" class="mt-1 w-full rounded-2xl border border-slate-200 px-3 py-2 text-sm">
                </div>
                <div>
                    <label class="text-[10px] font-bold text-slate-500 uppercase">HTML 内容</label>
                    <textarea id="ops-ann-html" rows="6" class="mt-1 w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm font-mono outline-none focus:border-ops-500" placeholder="<p>系统维护通知…</p>"></textarea>
                </div>
                <button type="button" id="ops-btn-publish-ann" class="w-full py-3 rounded-2xl bg-ops-600 hover:bg-ops-700 text-white text-sm font-bold shadow-lg">发布 / 更新公告</button>
            </div>
        </div>
    </div>

    <div id="ops-publish-tab-audit" class="ops-publish-tab-panel hidden">
        <div class="tm-ops-glass rounded-tm-3xl p-5 md:p-6 flex flex-col min-h-[320px]">
            <h2 class="text-sm font-bold text-slate-800 flex items-center gap-2 mb-4"><i class="ph ph-list-dashes text-ops-600"></i> 敏感操作审计</h2>
            <div id="ops-audit-log" class="flex-1 overflow-y-auto list-scrollbar-ops space-y-2 text-xs max-h-[70vh]"></div>
        </div>
    </div>
</div>

<div id="ops-plan-modal" class="hidden fixed inset-0 z-[200] flex items-center justify-center p-4 tm-ops-modal-backdrop">
    <div class="bg-white rounded-tm-3xl shadow-2xl max-w-lg w-full p-6 md:p-8 relative fade-in border border-indigo-100 max-h-[92vh] overflow-y-auto list-scrollbar-ops">
        <button type="button" id="ops-plan-modal-close" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600"><i class="ph ph-x text-xl"></i></button>
        <h3 id="ops-plan-modal-title" class="text-lg font-bold text-slate-800 pr-8">编辑套餐</h3>
        <input type="hidden" id="ops-plan-modal-plan-id" value="">
        <div class="space-y-3">
            <div>
                <label class="text-[10px] font-bold text-slate-500 uppercase">订阅类型名称</label>
                <input type="text" id="ops-plan-field-name" class="mt-1 w-full rounded-2xl border border-slate-200 px-4 py-2.5 text-sm outline-none focus:border-ops-500">
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="text-[10px] font-bold text-slate-500 uppercase">年付原价（元）</label>
                    <input type="number" id="ops-plan-field-price-original-y" min="0" step="1" class="mt-1 w-full rounded-2xl border border-slate-200 px-4 py-2.5 text-sm">
                </div>
                <div>
                    <label class="text-[10px] font-bold text-slate-500 uppercase">年付现价（元）</label>
                    <input type="number" id="ops-plan-field-price-current-y" min="0" step="1" class="mt-1 w-full rounded-2xl border border-slate-200 px-4 py-2.5 text-sm">
                </div>
            </div>
            <div>
                <label class="text-[10px] font-bold text-slate-500 uppercase">折扣文案</label>
                <input type="text" id="ops-plan-field-discount-label" class="mt-1 w-full rounded-2xl border border-slate-200 px-4 py-2.5 text-sm">
            </div>
            <p id="ops-plan-modal-discount-auto" class="text-[10px] text-ops-800 rounded-xl bg-ops-50 px-3 py-2 border border-ops-100"></p>
            <div class="grid grid-cols-2 gap-3">
                <div><label class="text-[10px] font-bold text-slate-500 uppercase">用户上限</label><input type="number" id="ops-plan-field-max-users" min="0" class="mt-1 w-full rounded-2xl border border-slate-200 px-4 py-2.5 text-sm"></div>
                <div><label class="text-[10px] font-bold text-slate-500 uppercase">产品上限</label><input type="number" id="ops-plan-field-max-products" min="0" class="mt-1 w-full rounded-2xl border border-slate-200 px-4 py-2.5 text-sm"></div>
                <div><label class="text-[10px] font-bold text-slate-500 uppercase">供应商上限</label><input type="number" id="ops-plan-field-max-suppliers" min="0" class="mt-1 w-full rounded-2xl border border-slate-200 px-4 py-2.5 text-sm"></div>
                <div><label class="text-[10px] font-bold text-slate-500 uppercase">客户上限</label><input type="number" id="ops-plan-field-max-customers" min="0" class="mt-1 w-full rounded-2xl border border-slate-200 px-4 py-2.5 text-sm"></div>
            </div>
            <button type="button" id="ops-plan-modal-save" class="w-full py-3 rounded-2xl bg-ops-600 hover:bg-ops-700 text-white text-sm font-bold shadow-lg">保存到数据库</button>
        </div>
    </div>
</div>
