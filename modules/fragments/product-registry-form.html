<div class="space-y-4">
    <section class="tm-product-edit-section rounded-2xl border border-slate-100 bg-white p-4 md:p-5">
        <h3 class="tm-product-edit-section__title">基本信息 <span class="text-slate-300 font-normal normal-case tracking-normal">（必填）</span></h3>
        <div class="tm-product-cover-row mb-3 flex items-center gap-3">
            <div id="detail-product-cover-preview" class="w-16 h-16 rounded-xl border border-dashed border-slate-200 bg-slate-50 flex items-center justify-center overflow-hidden shrink-0">
                <i class="ph ph-image text-2xl text-slate-300" aria-hidden="true"></i>
            </div>
            <div>
                <label class="tm-product-label block mb-1">SPU 主图</label>
                <input type="file" id="detail-product-cover-input" accept="image/*" class="text-[11px] text-slate-500" />
                <p class="tm-product-hint">保存产品后可上传；规格图在规格矩阵行上传</p>
            </div>
        </div>
        <div class="tm-product-edit-grid">
            <div class="tm-product-field tm-product-field--full">
                <label class="tm-product-label" for="detail-product-name">产品名称<span class="tm-product-required">*</span></label>
                <input id="detail-product-name" type="text" class="form-input" placeholder="如：东北大板原味" autocomplete="off" />
            </div>
            <div class="tm-product-field">
                <label class="tm-product-label" for="detail-product-category">商品类别 <span class="text-[10px] text-slate-400 font-normal">选填</span></label>
                <select id="detail-product-category" class="form-input w-full" aria-label="商品类别"></select>
            </div>
            <div class="tm-product-field">
                <label class="tm-product-label" for="detail-product-price">预设销售价<span class="tm-product-required">*</span></label>
                <div class="tm-product-input-suffix">
                    <input id="detail-product-price" type="number" min="0" step="0.01" class="form-input font-mono font-bold text-brand-600" placeholder="0.00" />
                    <span class="tm-product-suffix">元</span>
                </div>
            </div>
            <div class="tm-product-field">
                <label class="tm-product-label" for="detail-product-base-unit">基本单位<span class="tm-product-required">*</span></label>
                <div class="flex gap-2">
                    <input type="text" id="detail-product-base-unit" class="form-input flex-1 min-w-0" placeholder="件、箱、吨" autocomplete="off" oninput="window.ProductModule && window.ProductModule.onBaseUnitChanged()" />
                    <button type="button" onclick="openProductUnitModal()" class="tm-product-unit-btn shrink-0" title="配置包装单位换算">换算</button>
                </div>
            </div>
            <div class="tm-product-field">
                <label class="tm-product-label" for="detail-product-stock">当前库存总量</label>
                <input id="detail-product-stock" type="number" min="0" step="1" class="form-input font-mono" placeholder="留空视为 0" />
                <p class="tm-product-hint">按基本单位统计；分仓填写将自动汇总</p>
            </div>
        </div>
    </section>

    <p id="product-capability-hint" class="hidden text-[11px] text-slate-400 px-1"></p>

    <!-- 能力卡片区：按租户档案动态显隐 -->
    <section id="product-capability-cards" class="tm-product-edit-section rounded-2xl border border-slate-100 bg-white p-4 md:p-5 hidden">
        <h3 class="tm-product-edit-section__title">行业能力 <span class="text-slate-300 font-normal normal-case tracking-normal">（按需开启）</span></h3>
        <div class="space-y-3">
            <details id="cap-card-variants" class="tm-cap-card rounded-xl border border-slate-100 p-3">
                <summary class="cursor-pointer flex items-center justify-between">
                    <span><i class="ph ph-squares-four text-brand-500 mr-2"></i><strong>规格与属性</strong></span>
                    <span id="cap-summary-variants" class="text-xs text-slate-500">未启用规格</span>
                </summary>
                <div class="mt-3 space-y-2">
                    <p class="text-[10px] text-slate-400">颜色、尺码、容量等规格属性，生成多 SKU</p>
                    <label class="flex items-center gap-2 text-sm"><input type="checkbox" id="detail-track-variants" /> 启用多规格</label>
                    <select id="detail-variant-template" class="form-input w-full text-sm"><option value="">选择属性模板</option></select>
                    <div id="detail-variant-matrix" class="text-xs text-slate-500"></div>
                </div>
            </details>
            <details id="cap-card-expiry" class="tm-cap-card rounded-xl border border-slate-100 p-3">
                <summary class="cursor-pointer flex items-center justify-between">
                    <span><i class="ph ph-calendar-check text-amber-500 mr-2"></i><strong>保质期管理</strong></span>
                    <span id="cap-summary-expiry" class="text-xs text-slate-500">未启用</span>
                </summary>
                <div class="mt-3 space-y-2">
                    <label class="flex items-center gap-2 text-sm"><input type="checkbox" id="detail-track-expiry" /> 按批次管理保质期</label>
                    <div class="flex gap-2 items-center">
                        <label class="text-sm text-slate-600">默认保质期</label>
                        <input type="number" id="detail-shelf-life-days" class="form-input w-24 text-sm" min="1" placeholder="180" />
                        <span class="text-xs text-slate-400">天</span>
                    </div>
                    <select id="detail-expiry-policy" class="form-input w-full text-sm">
                        <option value="FEFO">先到期先出 (FEFO)</option>
                        <option value="FIFO">先进先出 (FIFO)</option>
                    </select>
                </div>
            </details>
            <details id="cap-card-serial" class="tm-cap-card rounded-xl border border-slate-100 p-3">
                <summary class="cursor-pointer flex items-center justify-between">
                    <span><i class="ph ph-barcode text-violet-500 mr-2"></i><strong>序列号管理（3C 一货一码）</strong></span>
                    <span id="cap-summary-serial" class="text-xs text-slate-500">未启用</span>
                </summary>
                <div class="mt-3 space-y-2">
                    <p class="text-[10px] text-slate-400">适用于手机、数码等需唯一序列号追踪的商品</p>
                    <label class="flex items-center gap-2 text-sm"><input type="checkbox" id="detail-track-serial" /> 入库/出库需扫码</label>
                    <select id="detail-serial-mode" class="form-input w-full text-sm">
                        <option value="STRICT">严格模式（必须扫够码）</option>
                        <option value="RELAXED">宽松模式</option>
                    </select>
                </div>
            </details>
        </div>
    </section>

    <section class="tm-product-edit-section tm-product-edit-section--advanced rounded-2xl border border-slate-100 bg-white p-4 md:p-5">
        <button type="button" onclick="toggleAuditProductAdvanced()" class="tm-product-advanced-toggle w-full" aria-expanded="false" aria-controls="product-advanced-drawer">
            <span class="flex items-center gap-2">
                <i class="ph ph-sliders-horizontal text-brand-500"></i>
                <span class="font-bold text-slate-700">高级配置</span>
                <span class="text-[10px] text-slate-400 font-normal">选填</span>
            </span>
            <i id="product-detail-advanced-icon" class="ph ph-caret-down text-slate-400 transition-transform"></i>
        </button>
        <div id="product-advanced-drawer" class="tm-product-advanced-drawer" aria-hidden="true">
            <div class="tm-product-edit-grid tm-product-edit-grid--advanced">
                <div class="tm-product-field">
                    <label class="tm-product-label" for="detail-product-sku-input">产品 SKU</label>
                    <input id="detail-product-sku-input" type="text" class="form-input font-mono text-sm" placeholder="留空将自动生成" autocomplete="off" />
                </div>
                <div class="tm-product-field">
                    <label class="tm-product-label" for="detail-product-supplier">关联供应商</label>
                    <select id="detail-product-supplier" class="form-input"></select>
                </div>
                <div class="tm-product-field">
                    <label class="tm-product-label" for="detail-product-purchase-unit">默认入库单位</label>
                    <select id="detail-product-purchase-unit" class="form-input"></select>
                </div>
                <div class="tm-product-field">
                    <label class="tm-product-label" for="detail-product-sales-unit">默认出库单位</label>
                    <select id="detail-product-sales-unit" class="form-input"></select>
                </div>
                <div class="tm-product-field">
                    <label class="tm-product-label" for="detail-product-warning-stock">预警库存下限</label>
                    <input id="detail-product-warning-stock" type="number" min="0" step="1" class="form-input border-red-100 font-mono" placeholder="基本单位" />
                </div>
                <div class="tm-product-field tm-product-field--full">
                    <label class="tm-product-label">各仓库库存</label>
                    <div id="detail-product-warehouse-stock" class="tm-product-warehouse-panel"></div>
                </div>
                <div class="tm-product-field tm-product-field--full">
                    <label class="tm-product-label" for="detail-product-description">产品详情描述</label>
                    <textarea id="detail-product-description" class="form-input tm-product-textarea no-scrollbar" rows="3" placeholder="规格、卖点、存储说明等"></textarea>
                </div>
            </div>
        </div>
    </section>
</div>
