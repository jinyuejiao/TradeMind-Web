<!-- 会员中心 · 推荐官条（与 referral-rewards-modal hero / UI 工程对齐） -->
<div class="tm-member-referral-banner member-referral-hero rounded-[2rem] md:rounded-[2.5rem] p-5 md:p-6 relative overflow-hidden border border-teal-100/80 bg-gradient-to-br from-teal-50/95 via-white/90 to-emerald-50/80 shadow-sm">
    <div class="absolute -right-6 -top-6 w-32 h-32 rounded-full bg-[#14B8A6]/15 blur-2xl pointer-events-none" aria-hidden="true"></div>
    <div class="relative z-10 flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">
        <div class="flex items-start gap-3 min-w-0">
            <div class="w-11 h-11 rounded-2xl bg-[#14B8A6] text-white flex items-center justify-center shrink-0 shadow-lg shadow-[#14B8A6]/25">
                <i class="ph ph-gift text-xl"></i>
            </div>
            <div class="min-w-0 text-left">
                <p class="text-[9px] font-black text-[#14B8A6] uppercase tracking-widest">Referral Program</p>
                <h3 class="text-base font-black text-slate-900 mt-0.5">巨猿推荐官计划</h3>
                <p class="text-[11px] text-slate-600 mt-1 leading-relaxed">好友用您的码注册可额外获得试用延长；好友首次订阅您立返 <span class="font-black text-[#14B8A6]">¥100</span> 现金奖励</p>
            </div>
        </div>
        <div class="flex flex-col sm:flex-row sm:items-stretch gap-3 w-full lg:w-auto shrink-0">
            <div class="rounded-2xl bg-white/80 backdrop-blur-md border border-teal-100 px-5 py-3 text-center sm:min-w-[148px]">
                <p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest">专属推荐码</p>
                <p id="referral-code" class="text-lg font-mono font-black text-teal-800 tracking-tight mt-0.5">—</p>
            </div>
            <div class="grid grid-cols-2 sm:flex sm:flex-col gap-2 sm:gap-2 sm:justify-center">
                <button type="button" onclick="openReferralListModal()" class="tm-member-ref-btn-outline min-h-[44px] px-3 py-2.5 rounded-2xl border-2 border-teal-200 bg-white/90 text-teal-900 text-xs font-black hover:bg-teal-50 transition flex items-center justify-center gap-1.5 whitespace-nowrap">
                    <i class="ph ph-users-three text-base shrink-0"></i><span>推荐名单</span>
                </button>
                <button type="button" onclick="showPoster()" class="tm-member-ref-btn-primary min-h-[44px] px-3 py-2.5 bg-[#14B8A6] text-white rounded-2xl font-black text-xs shadow-lg shadow-[#14B8A6]/25 hover:bg-[#0D9488] active:scale-[0.98] transition flex items-center justify-center gap-1.5 whitespace-nowrap">
                    <i class="ph ph-image-square-bold text-base shrink-0"></i><span>生成海报</span>
                </button>
            </div>
        </div>
    </div>
</div>
