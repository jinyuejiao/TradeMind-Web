    <script>
        // 全局认证状态变量
        let authChecked = false;
        let authStatus = false;
        
        // 预检查认证状态
        function preCheckAuth() {
            console.log('开始预检查认证状态');
            try {
                // 检查 auth.js 是否已加载
                if (typeof window.checkAuth === 'function') {
                    console.log('auth.js 已加载，开始检查认证状态');
                    authStatus = window.checkAuth();
                    authChecked = true;
                    console.log('预检查认证状态完成，结果:', authStatus);
                } else {
                    console.error('auth.js 未加载，checkAuth 函数不可用');
                    // 尝试直接检查 localStorage
                    try {
                        const token = localStorage.getItem('token');
                        const loginTimestamp = localStorage.getItem('login_timestamp');
                        if (token && loginTimestamp) {
                            console.log('通过直接检查 localStorage，发现认证信息存在');
                            authStatus = true;
                        } else {
                            console.log('通过直接检查 localStorage，未发现认证信息');
                            authStatus = false;
                        }
                    } catch (error) {
                        console.error('直接检查 localStorage 时发生错误:', error);
                        authStatus = false;
                    }
                }
            } catch (error) {
                console.error('预检查认证状态时发生错误:', error);
                authStatus = false;
            }
        }
        
        // 立即执行预检查
        preCheckAuth();
        
        // 页面加载时同步用户上下文信息
        document.addEventListener('DOMContentLoaded', function() {
            var isEmbedded = false;
            try {
                isEmbedded = (window.self !== window.top) || (new URLSearchParams(location.search).get('embed') === '1');
            } catch (e) {
                isEmbedded = true;
            }
            // 嵌入模式下不再注入公共壳层 UI，避免重复导航/header/footer
            if (!isEmbedded && window.injectCommonUI) {
                window.injectCommonUI();
            }
        });
    </script>

                    <div id="crm-ai-script-loading" class="hidden mt-4 text-xs text-brand-600 font-bold flex items-center gap-2">
                        <span class="w-3 h-3 border-2 border-brand-500 border-t-transparent rounded-full animate-spin"></span>
                        话术生成中...
                    </div>
                    <div id="crm-ai-script-result" class="hidden mt-4 rounded-xl border border-slate-200 bg-white p-3">
                        <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">建议话术</p>
                        <p id="crm-ai-script-text" class="text-xs text-slate-700 leading-relaxed"></p>
                    </div>
                </div>
            </div>
            <div class="px-6 py-4 border-t border-slate-100 bg-white shrink-0">
                <button onclick="closeCrmAiModal()" class="w-full py-3 rounded-2xl border border-slate-200 text-xs font-bold text-slate-500 hover:bg-slate-50 transition">完成</button>
            </div>
        </div>
    </div>

    <!-- 汉字拼音首字母（用于索引 / 排序）；失败时不影响页面，仅中文暂归入「#」直至库就绪 -->
    <script type="module">
        try {
            const { pinyin } = await import('https://cdn.jsdelivr.net/npm/pinyin-pro@3.26.0/dist/index.mjs');
            window.__crmPinyin = pinyin;
        } catch (e) {
            console.warn('[CRM] pinyin-pro 加载失败，中文索引将降级:', e);
        }
    </script>

    <script>
        const GATEWAY_URL = window.getApiUrl('gateway');
        const LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
        const LETTER_SECTIONS = LETTERS.concat('#');
        const state = {
            customers: [],
            filteredCustomers: [],
            statusOptions: [],
            currentCustomer: null,
            modalMode: 'new',
            activeLetter: ''
        };

        function switchTab(tabName) {
            const urlMap = {
                dashboard: '../dashboard/dashboard.html',
                biz: '../SmartOps/SmartOps.html',
                crm: '',
                supply: '../product-center/product-center.html',
                supplier: '../supply-chain/supply-chain.html'
            };
            const target = urlMap[tabName];
            if (target) window.location.href = target;
        }

        function escapeHtml(value) {
            if (value === null || value === undefined) return '';
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function normalizeCustomer(item) {
            return {
                id: item.id != null ? item.id : (item.custId != null ? item.custId : item.cust_id),
                name: item.name || '未命名客户',
                phone: item.phone || '',
                email: item.email || '',
                source: item.source || 'OTHER',
                status: item.status || item.cust_status || 'ACTIVE',
                summary: item.summary || '',
                region: item.region || '',
                address: item.address || '',
                createTime: item.createTime || null
            };
        }

        function getStatusName(statusCode) {
            const option = state.statusOptions.find(function(opt) { return opt.code === statusCode; });
            return option ? option.name : (statusCode || '未知状态');
        }

        function getStatusChip(statusCode) {
            if (statusCode === 'ACTIVE') return 'bg-brand-50 text-brand-700 border-brand-100';
            if (statusCode === 'SLEEPING' || statusCode === 'DORMANT' || statusCode === 'INACTIVE') return 'bg-slate-100 text-slate-600 border-slate-200';
            if (statusCode === 'LOST') return 'bg-rose-50 text-rose-600 border-rose-100';
            return 'bg-blue-50 text-blue-700 border-blue-100';
        }

        function getSourceLabel(source) {
            const map = { WECHAT: '微信', ALIPAY: '支付宝', PHONE: '电话', OTHER: '其他' };
            return map[source] || source || '未知';
        }

        function getInitial(name) {
            if (!name) return 'NA';
            return name.trim().slice(0, 2).toUpperCase();
        }

        /** DOM id：HTML id 不能安全使用「#」 */
        function letterSectionDomId(letter) {
            return letter === '#' ? 'letter-other' : ('letter-' + letter);
        }

        /**
         * 客户名称首字符对应的 A–Z 分组（中文→拼音首字母，数字/符号→#）
         */
        function getFirstLetter(name) {
            var s = (name || '').trim();
            if (!s) return '#';
            var ch = s.charAt(0);
            if (/^[a-zA-Z]$/.test(ch)) return ch.toUpperCase();
            if (/^[0-9]$/.test(ch)) return '#';
            if (window.__crmPinyin) {
                try {
                    var py = window.__crmPinyin(ch, { pattern: 'first', toneType: 'none' });
                    var L = String(py || '').trim().charAt(0).toUpperCase();
                    if (/^[A-Z]$/.test(L)) return L;
                } catch (err) { /* ignore */ }
            }
            return '#';
        }

        function compareCustomersByName(a, b) {
            var la = getFirstLetter(a.name);
            var lb = getFirstLetter(b.name);
            var ia = LETTER_SECTIONS.indexOf(la);
            var ib = LETTER_SECTIONS.indexOf(lb);
            var va = ia === -1 ? 999 : ia;
            var vb = ib === -1 ? 999 : ib;
            if (va !== vb) return va - vb;
            return String(a.name || '').localeCompare(String(b.name || ''), 'zh-Hans-CN');
        }

        async function fetchCustomerStatusOptions() {
            try {
                const response = await wrappedFetch(GATEWAY_URL + '/api/v1/crm/dictionary/D009', { method: 'GET' });
                if (response.ok) {
                    const result = await response.json();
                    state.statusOptions = Array.isArray(result) ? result : [];
                }
            } catch (error) {
                console.error('加载客户状态字典失败:', error);
            }
            if (!state.statusOptions.length) {
                state.statusOptions = [
                    { code: 'ACTIVE', name: '活跃客户' },
                    { code: 'INACTIVE', name: '沉睡客户' }
                ];
            }
            const select = document.getElementById('cust-status');
            if (select) {
                select.innerHTML = state.statusOptions.map(function(option) {
                    return '<option value="' + escapeHtml(option.code) + '">' + escapeHtml(option.name) + '</option>';
                }).join('');
            }
        }

        function sortCustomersAlphabetically(list) {
            return (list || []).slice().sort(compareCustomersByName);
        }

        function countLettersInList(customerList) {
            var counts = {};
            LETTERS.forEach(function(L) { counts[L] = 0; });
            (customerList || []).forEach(function(c) {
                var L = getFirstLetter(c.name);
                if (counts[L] !== undefined) counts[L]++;
            });
            return counts;
        }

        function renderAlphaRail() {
            var rail = document.getElementById('customer-alpha-rail');
            if (!rail) return;
            var counts = countLettersInList(state.filteredCustomers);
            rail.innerHTML = LETTERS.map(function(letter) {
                var active = state.activeLetter === letter;
                var cnt = counts[letter] || 0;
                var empty = cnt === 0;
                var cls = active
                    ? 'bg-[#14B8A6] text-white shadow-sm'
                    : (empty ? 'text-slate-300' : 'text-slate-500 hover:text-brand-600 hover:bg-teal-50');
                return '<button type="button" title="' + letter + ' · ' + cnt + ' 人" onclick="jumpToLetter(\'' + letter + '\')" '
                    + 'class="crm-alpha-btn rounded-md text-[11px] md:text-[9px] font-bold transition ' + cls + '">' + letter + '</button>';
            }).join('');
        }

        function groupCustomers(customers) {
            const grouped = {};
            LETTER_SECTIONS.forEach(function(letter) { grouped[letter] = []; });
            customers.forEach(function(customer) {
                const letter = getFirstLetter(customer.name);
                if (grouped[letter]) grouped[letter].push(customer);
            });
            return grouped;
        }

        function renderCustomerList() {
            const container = document.getElementById('customer-list-container');
            if (!container) return;
            const customers = state.filteredCustomers;
            document.getElementById('customer-count').textContent = String(customers.length);

            if (!customers.length) {
                container.innerHTML = '<div class="p-8 text-center text-slate-400"><i class="ph ph-users text-4xl mb-3"></i><p class="text-sm">暂无客户数据</p></div>';
                renderAlphaRail();
                return;
            }

            const grouped = groupCustomers(customers);
            const sections = LETTER_SECTIONS.map(function(letter) {
                const list = grouped[letter];
                if (!list || !list.length) return '';
                const cards = list.map(function(cust) {
                    const active = state.currentCustomer && state.currentCustomer.id === cust.id ? 'bg-slate-50' : '';
                    return ''
                        + '<div class="customer-card p-4 border-b border-slate-100 hover:bg-slate-50 transition-all cursor-pointer relative group ' + active + '">'
                        + '  <div onclick="selectCustomer(' + cust.id + ')" class="pr-16 md:pr-14">'
                        + '    <div class="font-bold text-sm text-slate-800 card-name">' + escapeHtml(cust.name) + '</div>'
                        + '    <div class="flex gap-1.5 mt-2">'
                        + '      <span class="px-1.5 py-0.5 text-[9px] border rounded font-bold uppercase tracking-tighter ' + getStatusChip(cust.status) + '">' + escapeHtml(getStatusName(cust.status)) + '</span>'
                        + '      <span class="px-1.5 py-0.5 bg-slate-100 text-slate-500 text-[9px] border border-slate-200 rounded font-bold uppercase tracking-tighter">' + escapeHtml(getSourceLabel(cust.source)) + '</span>'
                        + '    </div>'
                        + '  </div>'
                        + '  <div class="absolute right-9 md:right-2 top-1/2 -translate-y-1/2 flex flex-row gap-1.5 crm-action-btn z-30">'
                        + '    <button type="button" onclick="event.stopPropagation(); openClientEditModal(\'edit\',' + cust.id + ')" class="p-2 bg-white shadow-md border border-slate-100 rounded-full text-slate-400 hover:text-brand-600"><i class="ph ph-pencil-simple text-sm"></i></button>'
                        + '    <button type="button" onclick="event.stopPropagation(); confirmDeleteClient(' + cust.id + ')" class="p-2 bg-white shadow-md border border-slate-100 rounded-full text-slate-400 hover:text-risk-high"><i class="ph ph-trash text-sm"></i></button>'
                        + '  </div>'
                        + '</div>';
                }).join('');
                var heading = letter === '#' ? '#' : letter;
                return '<div id="' + letterSectionDomId(letter) + '" class="crm-letter-section" data-crm-letter="' + escapeHtml(letter) + '"><div class="px-4 py-2 text-[10px] font-black uppercase tracking-widest text-slate-300 bg-slate-50 border-y border-slate-100">' + heading + '</div>' + cards + '</div>';
            }).join('');
            container.innerHTML = sections || '<div class="p-8 text-center text-slate-400"><p class="text-sm">暂无字母匹配数据</p></div>';
            renderAlphaRail();
        }

        function applyFilter() {
            const keyword = (document.getElementById('crmSearchInput').value || '').trim().toLowerCase();
            if (!keyword) {
                state.filteredCustomers = state.customers.slice();
            } else {
                state.filteredCustomers = state.customers.filter(function(cust) {
                    return [cust.name, cust.phone, cust.region].some(function(field) {
                        return String(field || '').toLowerCase().indexOf(keyword) !== -1;
                    });
                });
            }
            renderCustomerList();
        }

        async function loadCustomers(options) {
            const opts = options || {};
            const searchInput = document.getElementById('crmSearchInput');
            const keyword = opts.ignoreKeyword ? '' : ((searchInput && searchInput.value) || '').trim();
            const url = GATEWAY_URL + '/api/v1/crm/customers' + (keyword ? ('?keyword=' + encodeURIComponent(keyword)) : '');
            try {
                const response = await wrappedFetch(url, { method: 'GET' });
                if (!response.ok) throw new Error('获取客户列表失败: ' + response.status);
                const result = await response.json();
                state.customers = sortCustomersAlphabetically((Array.isArray(result) ? result : []).map(normalizeCustomer));
                state.filteredCustomers = state.customers.slice();
                renderCustomerList();
                if (!state.currentCustomer && state.filteredCustomers.length && window.innerWidth >= 768) {
                    selectCustomer(state.filteredCustomers[0].id);
                } else if (!state.filteredCustomers.length) {
                    clearCustomerDetail();
                }
            } catch (error) {
                console.error(error);
                document.getElementById('customer-list-container').innerHTML =
                    '<div class="p-8 text-center text-slate-400"><i class="ph ph-exclamation-circle text-4xl mb-3 text-red-500"></i><p class="text-sm">客户加载失败，请稍后重试</p></div>';
            }
        }

        async function selectCustomer(customerId) {
            try {
                const response = await wrappedFetch(GATEWAY_URL + '/api/v1/crm/customers/' + customerId, { method: 'GET' });
                if (!response.ok) throw new Error('获取客户详情失败');
                const detail = normalizeCustomer(await response.json());
                state.currentCustomer = detail;
                state.activeLetter = getFirstLetter(detail.name);
                if (state.activeLetter === '#') {
                    state.activeLetter = '';
                }
                renderCustomerDetail(detail);
                renderAlphaRail();
                if (window.TmCrm && typeof window.TmCrm.loadCustomerTimeline === 'function') {
                    await window.TmCrm.loadCustomerTimeline(detail.id);
                }
                if (window.innerWidth < 768) {
                    document.getElementById('crm-list-pane').classList.add('hidden');
                    document.getElementById('crm-detail-pane').classList.remove('hidden');
                    document.getElementById('view-crm').classList.add('crm-detail-active');
                }
                renderCustomerList();
            } catch (error) {
                console.error(error);
                alert('获取客户详情失败');
            }
        }

        function renderCustomerDetail(customer) {
            document.getElementById('crm-detail-name').textContent = customer.name;
            document.getElementById('customer-avatar').textContent = getInitial(customer.name);
            document.getElementById('customer-info').textContent = (customer.region || '未知地区') + ' | ' + (customer.phone || '-');
            document.getElementById('customer-tags').innerHTML =
                '<span class="px-2 py-0.5 text-[10px] font-bold border rounded ' + getStatusChip(customer.status) + '">' + escapeHtml(getStatusName(customer.status)) + '</span>' +
                '<span class="px-2 py-0.5 bg-slate-100 text-slate-600 text-[10px] border border-slate-200 rounded">' + escapeHtml(getSourceLabel(customer.source)) + '</span>';
        }

        function clearCustomerDetail() {
            state.currentCustomer = null;
            document.getElementById('crm-detail-name').textContent = '未选择客户';
            document.getElementById('customer-avatar').textContent = 'AH';
            document.getElementById('customer-info').textContent = '请选择一个客户查看详情';
            document.getElementById('customer-tags').innerHTML = '';
            if (window.TmCrm && typeof window.TmCrm.resetTimelinePlaceholder === 'function') {
                window.TmCrm.resetTimelinePlaceholder();
            }
        }

        function hideCrmDetail() {
            document.getElementById('crm-detail-pane').classList.add('hidden');
            document.getElementById('crm-list-pane').classList.remove('hidden');
            document.getElementById('view-crm').classList.remove('crm-detail-active');
        }

        function scrollLetterSectionIntoView(letter) {
            var container = document.getElementById('customer-list-container');
            var target = document.getElementById(letterSectionDomId(letter));
            if (!container || !target) return false;
            var cRect = container.getBoundingClientRect();
            var tRect = target.getBoundingClientRect();
            var delta = (tRect.top - cRect.top) + container.scrollTop;
            container.scrollTo({ top: Math.max(0, delta - 8), behavior: 'smooth' });
            return true;
        }

        function jumpToLetter(letter) {
            state.activeLetter = letter;
            renderAlphaRail();
            if (scrollLetterSectionIntoView(letter)) return;
            if (typeof window.showToast === 'function') {
                window.showToast('暂无「' + letter + '」分组客户');
            }
        }

        function setClientModalIcon(mode) {
            const iconEl = document.getElementById('client-modal-icon');
            if (!iconEl) return;
            iconEl.className = mode === 'edit' ? 'ph ph-user-circle text-xl' : 'ph ph-user-plus text-xl';
        }

        function openClientEditModal(mode, customerId) {
            state.modalMode = mode;
            const form = document.getElementById('client-edit-form');
            if (form) form.reset();
            const registryRoot = document.getElementById('crm-customer-registry-root');
            if (window.TmCustomerRegistry) window.TmCustomerRegistry.reset(registryRoot);
            if (mode === 'edit') {
                const customer = state.customers.find(function(item) { return item.id === customerId; }) || state.currentCustomer;
                if (!customer) return;
                document.getElementById('client-modal-title').textContent = '编辑客户档案';
                setClientModalIcon('edit');
                if (window.TmCustomerRegistry) {
                    window.TmCustomerRegistry.fill(registryRoot, customer);
                    const idEl = registryRoot && registryRoot.querySelector('#cust-id');
                    if (idEl) idEl.value = customer.id;
                }
            } else {
                document.getElementById('client-modal-title').textContent = '新增客户档案';
                setClientModalIcon('new');
            }
            var modalEl = document.getElementById('client-edit-modal');
            var openUnified = (window.parent && window.parent.TM_openUnifiedModal) || window.TM_openUnifiedModal;
            if (typeof openUnified === 'function') {
                openUnified(modalEl);
            } else {
                modalEl.classList.remove('hidden');
                document.body.style.overflow = 'hidden';
                var applyDialogShell = (window.parent && window.parent.TM_applyDialogShell) || window.TM_applyDialogShell;
                if (typeof applyDialogShell === 'function') {
                    applyDialogShell(modalEl);
                }
                if (typeof TM_notifyEmbedModal === 'function') TM_notifyEmbedModal(true);
            }
        }

        function closeClientEditModal() {
            var modalEl = document.getElementById('client-edit-modal');
            var closeUnified = (window.parent && window.parent.TM_closeUnifiedModal) || window.TM_closeUnifiedModal;
            if (typeof closeUnified === 'function') {
                closeUnified(modalEl);
            } else {
                modalEl.classList.add('hidden');
                document.body.style.overflow = '';
                if (typeof TM_notifyEmbedModal === 'function') TM_notifyEmbedModal(false);
            }
        }

        async function saveClient(event) {
            if (event) event.preventDefault();
            const registryRoot = document.getElementById('crm-customer-registry-root');
            const payload = window.TmCustomerRegistry
                ? window.TmCustomerRegistry.readPayload(registryRoot)
                : {
                    name: (document.getElementById('cust-name') || {}).value || '',
                    phone: (document.getElementById('cust-phone') || {}).value || '',
                    email: (document.getElementById('cust-email') || {}).value || '',
                    region: (document.getElementById('cust-region') || {}).value || '',
                    address: (document.getElementById('cust-address') || {}).value || '',
                    summary: (document.getElementById('cust-summary') || {}).value || ''
                };
            if (!payload.name) {
                alert('客户姓名不能为空');
                return;
            }
            if (!payload.phone) payload.phone = null;

            try {
                if (state.modalMode === 'edit') {
                    const idEl = registryRoot && registryRoot.querySelector('#cust-id');
                    const id = idEl ? idEl.value : '';
                    const response = await wrappedFetch(GATEWAY_URL + '/api/v1/crm/customers/' + id, {
                        method: 'PUT',
                        body: JSON.stringify(payload)
                    });
                    if (!response.ok) {
                        const err = await response.json().catch(function() { return {}; });
                        throw new Error(err.error || '更新客户失败');
                    }
                } else {
                    const response = await wrappedFetch(GATEWAY_URL + '/api/v1/crm/customers', {
                        method: 'POST',
                        body: JSON.stringify(payload)
                    });
                    if (!response.ok) {
                        const err = await response.json().catch(function() { return {}; });
                        throw new Error(err.error || '新增客户失败');
                    }
                }
                closeClientEditModal();
                await loadCustomers();
            } catch (error) {
                console.error(error);
                alert(error.message || '保存失败');
            }
        }

        function confirmDeleteClient(customerId) {
            const customer = state.customers.find(function(item) { return item.id === customerId; });
            if (!customer) return;
            const msg = '确定删除客户「' + customer.name + '」吗？此操作无法撤销。';
            const runDelete = function() { deleteCustomer(customerId); };
            if (window.TmConfirm && typeof window.TmConfirm.open === 'function') {
                window.TmConfirm.open({
                    title: '确认删除',
                    message: msg,
                    confirmLabel: '确认删除',
                    danger: true,
                    onConfirm: runDelete
                });
            } else if (confirm(msg)) {
                runDelete();
            }
        }

        async function deleteCustomer(customerId) {
            if (!customerId) return;
            const deletedId = customerId;
            try {
                const response = await wrappedFetch(GATEWAY_URL + '/api/v1/rd/customers/' + deletedId, {
                    method: 'DELETE'
                });
                const result = await response.json().catch(function() { return {}; });
                if (!response.ok || result.success === false) {
                    throw new Error(result.message || result.error || '删除客户失败');
                }
                if (state.currentCustomer && state.currentCustomer.id === deletedId) {
                    clearCustomerDetail();
                }
                await loadCustomers();
                const toastMsg = result.message || '客户已删除';
                if (typeof window.showToast === 'function') {
                    window.showToast(toastMsg);
                } else if (window.TM_UI && typeof window.TM_UI.toast === 'function') {
                    window.TM_UI.toast(toastMsg, 'success');
                }
            } catch (error) {
                console.error(error);
                const errMsg = error.message || '删除失败';
                if (window.TM_UI && typeof window.TM_UI.toast === 'function') {
                    window.TM_UI.toast(errMsg, 'error');
                } else {
                    alert(errMsg);
                }
            }
        }

        function toggleAdvanced(event) {
            if (event) event.preventDefault();
            if (window.TmCustomerRegistry) {
                window.TmCustomerRegistry.toggleAdvanced(document.getElementById('crm-customer-registry-root'));
            }
        }

        function toggleCrmPhoneCard(event) {
            if (event) event.stopPropagation();
            if (!state.currentCustomer) {
                alert('请先选择客户');
                return;
            }
            const card = document.getElementById('crm-phone-card');
            if (!card) return;
            document.getElementById('crm-phone-customer-name').textContent = state.currentCustomer.name || '-';
            document.getElementById('crm-phone-number').textContent = state.currentCustomer.phone || '-';
            card.classList.toggle('hidden');
        }

        function hideCrmPhoneCard() {
            const card = document.getElementById('crm-phone-card');
            if (!card) return;
            card.classList.add('hidden');
        }

        function copyCrmPhone(event) {
            if (event) event.stopPropagation();
            const phoneText = document.getElementById('crm-phone-number');
            if (!phoneText) return;
            const phone = phoneText.innerText || '';
            navigator.clipboard.writeText(phone).then(function() {
                if (typeof window.showToast === 'function') {
                    window.showToast('电话号码已复制');
                }
            }).catch(function() {
                alert('复制失败，请手动复制');
            });
        }

        function openCrmAiModal() {
            const modal = document.getElementById('crm-ai-modal');
            if (modal) modal.classList.remove('hidden');
            if (typeof TM_notifyEmbedModal === 'function') TM_notifyEmbedModal(true);
        }

        function closeCrmAiModal() {
            const modal = document.getElementById('crm-ai-modal');
            if (modal) modal.classList.add('hidden');
            if (typeof TM_notifyEmbedModal === 'function') TM_notifyEmbedModal(false);
        }

        function generateCrmMarketingSuggestion() {
            const target = document.getElementById('crm-ai-suggestion-text');
            if (!target) return;
            if (!state.currentCustomer) {
                target.textContent = '请先选择客户，再生成营销建议。';
                return;
            }
            target.textContent = '建议针对 ' + state.currentCustomer.name + ' 推送最近热销产品组合，并提供限时折扣。';
        }

        function generateCrmMarketingScript() {
            const loading = document.getElementById('crm-ai-script-loading');
            const box = document.getElementById('crm-ai-script-result');
            const text = document.getElementById('crm-ai-script-text');
            if (!loading || !box || !text) return;
            loading.classList.remove('hidden');
            box.classList.add('hidden');
            setTimeout(function() {
                loading.classList.add('hidden');
                box.classList.remove('hidden');
                text.textContent = state.currentCustomer
                    ? ('您好 ' + state.currentCustomer.name + '，这边为您准备了本周新品清单和阶梯优惠，是否安排 10 分钟沟通？')
                    : '请先选择客户，再生成营销话术。';
            }, 600);
        }

        function setupCrmSearchInput(onSearch) {
            const searchInput = document.getElementById('crmSearchInput');
            if (!searchInput) return null;

            function enableEditing() {
                searchInput.removeAttribute('readonly');
            }

            function clearBrowserAutofill() {
                if (searchInput.dataset.userTyped === '1') return false;
                if (!searchInput.value) return false;
                searchInput.value = '';
                return true;
            }

            searchInput.value = '';
            searchInput.setAttribute('readonly', 'readonly');
            searchInput.addEventListener('focus', enableEditing);
            searchInput.addEventListener('mousedown', enableEditing);
            searchInput.addEventListener('touchstart', enableEditing, { passive: true });
            searchInput.addEventListener('input', function() {
                searchInput.dataset.userTyped = '1';
                if (typeof onSearch === 'function') onSearch();
            });
            searchInput.addEventListener('animationstart', function(event) {
                if (event.animationName === 'crmSearchAutofillStart' && clearBrowserAutofill()) {
                    if (typeof onSearch === 'function') onSearch();
                }
            });

            var guardLeft = 24;
            var guardTimer = setInterval(function() {
                if (clearBrowserAutofill() && typeof onSearch === 'function') {
                    onSearch();
                }
                if (--guardLeft <= 0) clearInterval(guardTimer);
            }, 250);

            return searchInput;
        }

        function debounce(fn, wait) {
            let timer = null;
            return function() {
                const args = arguments;
                clearTimeout(timer);
                timer = setTimeout(function() { fn.apply(null, args); }, wait);
            };
        }

        function applyResponsiveLayout() {
            if (window.innerWidth >= 768) {
                document.getElementById('crm-list-pane').classList.remove('hidden');
                document.getElementById('crm-detail-pane').classList.remove('hidden');
                document.getElementById('view-crm').classList.remove('crm-detail-active');
            } else if (!state.currentCustomer) {
                document.getElementById('crm-detail-pane').classList.add('hidden');
                document.getElementById('crm-list-pane').classList.remove('hidden');
            }
        }

        document.addEventListener('DOMContentLoaded', async function() {
            try {
                if (window.TmCustomerRegistry) {
                    await window.TmCustomerRegistry.mount(document.getElementById('crm-customer-registry-root'));
                }
                if (typeof window.loadUserInfo === 'function') window.loadUserInfo();
                if (window.TmCrm && typeof window.TmCrm.init === 'function') {
                    await window.TmCrm.init({ gatewayUrl: GATEWAY_URL });
                }
                await fetchCustomerStatusOptions();
                renderAlphaRail();
                const debouncedLoadCustomers = debounce(loadCustomers, 300);
                setupCrmSearchInput(debouncedLoadCustomers);
                await loadCustomers({ ignoreKeyword: true });

                (function waitPinyinResort() {
                    var left = 80;
                    var timer = setInterval(function() {
                        if (window.__crmPinyin) {
                            clearInterval(timer);
                            if (state.customers.length) {
                                state.customers = sortCustomersAlphabetically(state.customers);
                                state.filteredCustomers = state.customers.slice();
                                renderCustomerList();
                            }
                            return;
                        }
                        if (--left <= 0) clearInterval(timer);
                    }, 50);
                })();

                document.addEventListener('click', function(event) {
                    const card = document.getElementById('crm-phone-card');
                    if (!card || card.classList.contains('hidden')) return;
                    if (!card.contains(event.target)) {
                        hideCrmPhoneCard();
                    }
                });
                document.getElementById('client-edit-form').addEventListener('submit', saveClient);
                applyResponsiveLayout();
            } catch (error) {
                console.error('CRM 初始化失败:', error);
            }
        });

        window.addEventListener('resize', applyResponsiveLayout);
    </script>

</body>
