<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <script src="./assets/js/tm-app-api-override.js"></script>
    <script src="./assets/js/vendor/tm-capacitor.js?v=20260720cap1"></script>
    <script src="./assets/js/env-config.js"></script>
    <script src="./assets/js/tm-native-bridge.js?v=20260720native2"></script>
    <script src="./assets/js/tm-app-boot.js?v=20260720boot1"></script>
    <script src="./assets/js/api-client.js?v=20260506r3"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>极速经营诊断 — TradeMind</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="./assets/css/phosphor-icons.css?v=20260619ui3">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#F0FDFA', 100: '#CCFBF1', 500: '#14B8A6', 600: '#0D9488', 900: '#134E4A' },
                        slate: { 50: '#F8FAFC', 100: '#F1F5F9', 200: '#E2E8F0', 800: '#1E293B', 900: '#0F172A' }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
        .tm-chip input:checked + span {
            background: #0D9488; color: #fff; border-color: #0D9488;
        }
        .tm-chip span {
            display: inline-flex; align-items: center; justify-content: center;
            padding: 0.5rem 0.75rem; border-radius: 9999px; border: 1px solid #E2E8F0;
            font-size: 12px; font-weight: 700; color: #475569; background: #fff;
            cursor: pointer; user-select: none;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">
    <header class="bg-gradient-to-br from-slate-900 to-slate-800 text-white px-4 py-6 md:px-8">
        <div class="max-w-3xl mx-auto">
            <p class="text-teal-300 text-xs font-bold tracking-wider uppercase mb-2">TradeMind · 极速经营诊断</p>
            <h1 class="text-xl md:text-2xl font-bold">先看懂生意，再决定怎么用系统</h1>
            <p class="text-slate-300 text-sm mt-2 leading-relaxed">回答几个核心问题，马上拿到可落地的经营分析。柜台当面开单用极速开单；语音/拍照/文本偏事后补录。</p>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 py-6 md:px-8 md:py-8">
        <!-- 答卷 -->
        <section id="survey-panel" class="space-y-6">
            <form id="biz-diag-form" class="space-y-6">
                <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm">
                    <h2 class="text-sm font-bold text-slate-900 mb-1">1. 各环节现在怎么做？</h2>
                    <p class="text-xs text-slate-500 mb-4">选最接近现状的一项（自动化程度）</p>
                    <div class="space-y-4" id="automation-fields"></div>
                </div>

                <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm">
                    <h2 class="text-sm font-bold text-slate-900 mb-1">2. 时间和精力主要耗在哪？</h2>
                    <p class="text-xs text-slate-500 mb-4">最多选 2 项（粗分档即可）</p>
                    <div class="flex flex-wrap gap-2" id="time-energy-fields"></div>
                </div>

                <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm">
                    <h2 class="text-sm font-bold text-slate-900 mb-1">3. 当下最头疼的是？（主痛点）</h2>
                    <p class="text-xs text-slate-500 mb-4">可多选，建议选 1～3 项</p>
                    <div class="flex flex-wrap gap-2" id="pain-fields"></div>
                </div>

                <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm">
                    <h2 class="text-sm font-bold text-slate-900 mb-1">4. 大概一天开多少单？</h2>
                    <div class="flex flex-wrap gap-2" id="volume-fields"></div>
                </div>

                <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm">
                    <label class="text-sm font-bold text-slate-900" for="diag-notes">补充说明（选填）</label>
                    <textarea id="diag-notes" rows="3" maxlength="300"
                        class="mt-2 w-full rounded-xl border border-slate-200 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500"
                        placeholder="例如：大客欠款难催、旺季找货乱、微信记账对不上…"></textarea>
                </div>

                <div class="flex flex-col sm:flex-row gap-3 pb-8">
                    <button type="submit" id="btn-submit-diag"
                        class="flex-1 inline-flex items-center justify-center gap-2 rounded-xl bg-brand-600 hover:bg-brand-500 text-white font-bold py-3 px-4 shadow-md">
                        <i class="ph ph-magic-wand"></i> 生成极速经营分析
                    </button>
                    <button type="button" id="btn-skip-diag"
                        class="sm:w-40 inline-flex items-center justify-center rounded-xl border border-slate-200 bg-white text-slate-600 font-bold py-3 px-4 hover:bg-slate-50">
                        跳过，进工作台
                    </button>
                </div>
            </form>
        </section>

        <!-- 生成中 / 报告 -->
        <section id="report-panel" class="hidden">
            <div id="biz-ai-loading" class="hidden py-16 text-center">
                <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-teal-50 text-teal-600 mb-4">
                    <i class="ph ph-spinner text-3xl animate-spin"></i>
                </div>
                <p class="text-sm font-bold text-slate-800" data-biz-ai-loading-text>AI 正在根据答卷生成报告…</p>
                <p class="text-xs text-slate-400 mt-2">通常几十秒内完成</p>
            </div>
            <div id="biz-ai-report-body" class="bg-white rounded-2xl border border-slate-200 p-4 md:p-8 shadow-sm">
                <div class="mb-6">
                    <h1 id="biz-ai-report-title" class="text-xl md:text-2xl font-bold text-slate-900 mb-2">极速经营诊断</h1>
                    <p id="biz-ai-report-sub" class="text-xs text-slate-400">基于问卷</p>
                </div>
            </div>
            <div class="flex flex-col sm:flex-row gap-3 mt-6 pb-10">
                <button type="button" id="btn-enter-app"
                    class="flex-1 inline-flex items-center justify-center gap-2 rounded-xl bg-brand-600 hover:bg-brand-500 text-white font-bold py-3 px-4 shadow-md">
                    进入工作台开始使用
                </button>
                <button type="button" id="btn-back-survey"
                    class="sm:w-40 inline-flex items-center justify-center rounded-xl border border-slate-200 bg-white text-slate-600 font-bold py-3 px-4 hover:bg-slate-50">
                    返回修改答卷
                </button>
            </div>
            <p class="text-xs text-slate-400 text-center pb-8">报告已保存，之后可在「智能经营 → AI经营分析」再次查看；完善进销存数据后可重新生成更深报告。</p>
        </section>
    </main>

    <script src="./assets/js/auth.js?v=20260721bizDiag"></script>
    <script src="./assets/js/tm-biz-ai-insight.js?v=20260721bizDiag"></script>
    <script src="./assets/js/tm-biz-diag-survey.js?v=20260721bizDiag"></script>
</body>
</html>
