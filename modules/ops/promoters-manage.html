<div class="space-y-6 fade-in">
    <div class="tm-ops-glass rounded-tm-3xl p-5 md:p-6">
        <h2 class="text-sm font-bold text-slate-800 flex items-center gap-2 mb-1">
            <i class="ph ph-user-plus text-ops-600"></i> 独立推广员开号
        </h2>
        <p class="text-[10px] text-slate-500 leading-relaxed">
            为平台创建 <strong class="text-ops-700">ROLE_PROMOTER</strong> 账号（租户 <code class="text-[10px] bg-slate-100 px-1 rounded">SYSTEM_OPS</code>），自动生成 <strong>JY</strong> 推广码。
            推广员登录 <a href="../../promoter-portal.html" target="_blank" rel="noopener" class="text-ops-600 font-bold underline">推广中心 H5</a> 查看收益与推荐流水。
        </p>
        <p class="text-[10px] text-slate-400 mt-2 font-mono">POST /api/v1/ops/promoters</p>
    </div>

    <div class="grid md:grid-cols-2 gap-4">
        <form id="ops-promoter-form" class="tm-ops-glass rounded-tm-3xl p-5 md:p-6 space-y-4">
            <h3 class="text-xs font-bold text-slate-800">新建推广员</h3>
            <div>
                <label class="block text-[10px] font-bold text-slate-600 mb-1">登录名 <span class="text-rose-500">*</span></label>
                <input type="text" id="ops-promoter-username" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 text-sm" maxlength="50" placeholder="如 promoter_zhang" autocomplete="off" required>
            </div>
            <div>
                <label class="block text-[10px] font-bold text-slate-600 mb-1">登录密码 <span class="text-rose-500">*</span></label>
                <input type="password" id="ops-promoter-password" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 text-sm" minlength="6" placeholder="至少 6 位，将 MD5 后入库" required>
            </div>
            <div>
                <label class="block text-[10px] font-bold text-slate-600 mb-1">姓名 <span class="text-rose-500">*</span></label>
                <input type="text" id="ops-promoter-realname" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 text-sm" maxlength="50" placeholder="门户顶部展示" required>
            </div>
            <div>
                <label class="block text-[10px] font-bold text-slate-600 mb-1">手机号 <span class="text-rose-500">*</span></label>
                <input type="tel" id="ops-promoter-phone" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 text-sm" maxlength="11" inputmode="numeric" placeholder="11 位手机号" required>
            </div>
            <div>
                <label class="block text-[10px] font-bold text-slate-600 mb-1">邮箱（可选）</label>
                <input type="email" id="ops-promoter-email" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 text-sm" placeholder="选填">
            </div>
            <button type="submit" id="ops-promoter-submit" class="w-full py-3 rounded-2xl bg-ops-600 hover:bg-ops-700 text-white text-sm font-bold shadow-md transition-colors">
                创建推广员
            </button>
        </form>

        <div id="ops-promoter-result" class="tm-ops-glass rounded-tm-3xl p-5 md:p-6 hidden">
            <h3 class="text-xs font-bold text-emerald-700 flex items-center gap-2 mb-3">
                <i class="ph ph-check-circle"></i> 开号成功
            </h3>
            <dl class="text-xs space-y-2 text-slate-700">
                <div class="flex justify-between gap-2"><dt class="text-slate-500">用户 ID</dt><dd id="ops-promoter-res-uid" class="font-mono font-bold"></dd></div>
                <div class="flex justify-between gap-2"><dt class="text-slate-500">登录名</dt><dd id="ops-promoter-res-user" class="font-bold"></dd></div>
                <div class="flex justify-between gap-2"><dt class="text-slate-500">姓名</dt><dd id="ops-promoter-res-name"></dd></div>
                <div class="flex justify-between gap-2"><dt class="text-slate-500">手机号</dt><dd id="ops-promoter-res-phone" class="font-mono"></dd></div>
                <div class="flex justify-between gap-2 border-t border-emerald-100 pt-2 mt-2">
                    <dt class="text-slate-500">推广码</dt>
                    <dd id="ops-promoter-res-code" class="font-mono font-black text-ops-700 text-sm"></dd>
                </div>
            </dl>
            <p class="text-[10px] text-slate-500 mt-4 leading-relaxed">请将登录名、初始密码与推广码告知推广员；微信内打开推广中心可绑定 OAuth 静默登录。</p>
            <div class="mt-3 flex flex-wrap gap-2">
                <button type="button" id="ops-promoter-copy-code" class="px-3 py-2 rounded-xl bg-ops-50 text-ops-700 text-[10px] font-bold border border-ops-200">复制推广码</button>
                <a id="ops-promoter-portal-link" href="../../promoter-portal.html" target="_blank" rel="noopener" class="px-3 py-2 rounded-xl border border-slate-200 text-[10px] font-bold text-slate-600 hover:bg-slate-50">打开推广中心</a>
            </div>
        </div>

        <div id="ops-promoter-result-placeholder" class="tm-ops-glass rounded-tm-3xl p-5 md:p-6 flex items-center justify-center text-center text-slate-400 text-xs min-h-[200px]">
            填写左侧表单并提交后，此处显示开号结果与推广码
        </div>
    </div>
</div>
